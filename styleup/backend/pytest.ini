[pytest]
testpaths = tests
pythonpath = .
addopts = -q --tb=short
# `auto` evita marcar cada teste assíncrono à mão; o projeto não tem teste
# assíncrono que precise de outro laço de eventos.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:starlette.*
